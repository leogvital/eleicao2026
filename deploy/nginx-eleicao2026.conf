# eleicao2026.ddns.net — painel de apuração das Eleições 2026 (proxy para o processo PM2 "eleicao2026",
# 127.0.0.1:3030, código em /var/www/eleicao2026, repositório github.com/leogvital/eleicao2026).
# Atrás da Cloudflare: o nome precisa existir no DNS da Cloudflare (proxied) apontando para este servidor.
# Para outro nome (ex.: eleicao.seudominio.com.br) basta acrescentá-lo em server_name nos DOIS blocos.
# 443 usa certificado AUTO-ASSINADO temporário (Cloudflare "Full" aceita; "Full (strict)" exige certificado válido:
#   certbot certonly --webroot -w /var/www/eleicao2026/certbot-webroot -d <nome>  e trocar as linhas ssl_certificate).

server {
    listen 80;
    server_name eleicao2026.ddns.net;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/eleicao2026/certbot-webroot;
    }

    # Sem redirect para https: a Cloudflare em modo "Flexible" fala HTTP com a origem (redirect geraria loop).
    location / {
        include /etc/nginx/snippets/eleicao2026-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    server_name eleicao2026.ddns.net;

    ssl_certificate /etc/nginx/ssl/eleicao2026.crt;
    ssl_certificate_key /etc/nginx/ssl/eleicao2026.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
    }

    location / {
        include /etc/nginx/snippets/eleicao2026-proxy.conf;
    }
}
